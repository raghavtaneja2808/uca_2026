<body>
    <script>
        function* fibonacci() {
    // Implementation
    let a = 0;
    let b = 1;
    yield a;
    yield b;
    while(true){
        const temp = b;
        b = a + b;
        a = temp;
        yield b;
    }
}  
const fibGen = fibonacci();

    </script>
