<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <table id="data-table">
    </table>
    <script>
        const fields = [
            "First Name",
            "Last Name",
            "Email"
        ];
        const data_table = document.getElementById("data-table");
        data_table.innerHTML = fields.map(field => `  <label>${field}</label> 
  <input type="text"> `).join(" | ")
    </script>
</body>

</html>
