<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table id="data-table">
</table>
<script>
    const users = [
    {name:"Alice", age:53},
    {name:"Tim", age:74}
]
    const data_table = document.getElementById("data-table");
    data_table.innerHTML = users.map(user=>{
        return `  <tr>
    <td>${user.name}</td>
    <td>${user.age}</td>
  </tr>`
    }).join("")
</script>
</body>
</html>
